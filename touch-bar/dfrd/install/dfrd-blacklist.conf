# /etc/modprobe.d/dfrd-blacklist.conf — installed by dfrd install.sh
#
# In USB "display mode" (config 2) the Touch Bar is driven by apple_dfr_cfgsel
# (forces config 2 at enumeration) + appletbdrm (the DRM pixel driver). The
# config-2 HID digitizer must fall to hid-generic so a /dev/hidraw node appears
# for dfr-touchd to read taps from.
#
# The firmware-mode drivers apple_ibridge / apple_touchbar claim that HID
# interface and SUPPRESS the hidraw node (hid-generic never gets the device) ->
# dfr-touchd exits "no config-2 iBridge hidraw node found" -> dfrd.service
# restart-loops -> the bar flickers on/off. They are not needed in display mode,
# so block their autoload here.
#
# uninstall.sh removes this file, restoring the stock firmware Touch Bar (which
# DOES need apple_ibridge/apple_touchbar).
blacklist apple_ibridge
blacklist apple_touchbar
# `blacklist` only suppresses a module's own ALIASES; on this hardware the udev
# modalias autoload still pulled apple_ibridge/apple_touchbar in at boot. Hard
# block: any attempt to load them (alias, direct, or dependency) runs /bin/true
# (a no-op) instead, so hid-generic keeps the config-2 digitizer interface.
install apple_ibridge /bin/true
install apple_touchbar /bin/true
